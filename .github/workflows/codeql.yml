name: CodeQL

# SAST (analyse statique du code source) : cherche dans NOTRE code les failles que `npm audit` ne voit pas
# (injection, XSS, chemins non maîtrisés, cryptographie faible, désérialisation, secrets codés en dur…).
# Résultats : onglet Security > Code scanning du dépôt.
on:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * 1" # chaque lundi : de nouvelles règles peuvent révéler d'anciennes failles

# Par défaut, le robot ne peut que lire.
permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Droit supplémentaire limité à CE travail : publier les résultats dans l'onglet Security.
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false # le jeton GitHub n'est pas laissé dans .git (inutile ici)
      - uses: github/codeql-action/init@a3d1b77a1ba1550fbb5c74db1dc3a11f4a481126 # v3.39.2
        with:
          languages: javascript-typescript
          # security-extended : règles de sécurité plus larges que le jeu par défaut.
          queries: security-extended
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@a3d1b77a1ba1550fbb5c74db1dc3a11f4a481126 # v3.39.2
        with:
          category: "/language:javascript-typescript"
